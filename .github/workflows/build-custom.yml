name: Build Custom Helium (Cloud / Self-Hosted)

on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: 'Runner label (e.g., "self-hosted", "windows-latest", or custom runner label)'
        required: true
        default: 'self-hosted'
      arch:
        description: 'Target architecture'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - arm64

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build Helium ${{ inputs.arch }} on ${{ inputs.runs-on }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests Pillow

      - name: Run Helium Build
        shell: pwsh
        run: |
          if ('${{ inputs.arch }}' -eq 'arm64') {
            python build.py --arm
          } else {
            python build.py
          }

      - name: Package Helium
        shell: pwsh
        run: |
          python package.py

      - name: Upload Built Packages
        uses: actions/upload-artifact@v4
        with:
          name: helium-windows-${{ inputs.arch }}-build
          path: |
            build/*.zip
            build/*.exe
          if-no-files-found: warn
          retention-days: 7
